<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="100" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Grid lines background -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#334155" stroke-dasharray="6,6" stroke-width="2" />
  <line x1="80" y1="260" x2="432" y2="260" stroke="#334155" stroke-dasharray="6,6" stroke-width="2" />
  <line x1="80" y1="360" x2="432" y2="360" stroke="#334155" stroke-dasharray="6,6" stroke-width="2" />

  <!-- Baseline -->
  <line x1="70" y1="380" x2="442" y2="380" stroke="#64748b" stroke-width="6" stroke-linecap="round" />

  <!-- Bars -->
  <!-- Bar 1 -->
  <rect x="110" y="240" width="70" height="140" rx="14" fill="url(#bar1Grad)" />
  <!-- Bar 2 -->
  <rect x="210" y="160" width="70" height="220" rx="14" fill="url(#bar2Grad)" />
  <!-- Bar 3 -->
  <rect x="310" y="100" width="70" height="280" rx="14" fill="url(#bar3Grad)" />

  <!-- Trend Line with Glow -->
  <path d="M 145 220 Q 245 140, 345 80" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Trend points -->
  <circle cx="145" cy="220" r="10" fill="#ffffff" stroke="#0d9488" stroke-width="4" />
  <circle cx="245" cy="150" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
  <circle cx="345" cy="80" r="12" fill="#38bdf8" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />

  <!-- Sparkle AI Star -->
  <path d="M 400 90 Q 400 110 380 110 Q 400 110 400 130 Q 400 110 420 110 Q 400 110 400 90 Z" fill="#facc15" />
</svg>
